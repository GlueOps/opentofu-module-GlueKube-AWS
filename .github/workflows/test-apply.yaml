name: test-apply

# End-to-end test of `module "captain"`. Runs daily on a schedule, and on demand
# via workflow_dispatch.
#
# Flow: tofu init -> apply (real AWS + AutoGlue resources) -> invoke the AutoGlue
# kubernetes-setup action (examples/test/invoke_autoglue.sh) -> ssh to a master and run
# kubectl (examples/test/check_cluster_health.sh) -> tofu destroy (always).
#
# Required repository secrets (mapped to TF_VAR_* below):
#   AWS_ACCESS_KEY                 AWS_SECRET_KEY                 AWS_SESSION_TOKEN (optional)
#   NODE_AMI                       BASTION_AMI
#   AUTOGLUE_CLUSTER_NAME          AUTOGLUE_KEY                   AUTOGLUE_ORG_SECRET
#   AUTOGLUE_BASE_URL
#   ROUTE53_AWS_ACCESS_KEY_ID      ROUTE53_AWS_SECRET_ACCESS_KEY
#   DOMAIN_NAME                    ROUTE53_ZONE_ID                AUTOGLUE_CREDENTIAL_ID
# Additional secrets for the AutoGlue action invocation (invoke_autoglue.sh):
#   AUTOGLUE_API_KEY  (X-API-KEY header)            AUTOGLUE_ORG_NAME  (resolved to org id)
# Non-secret defaults (aws_region, azs, instance types, CIDRs, cloud) come from
# examples/test/variables.tf; override there if needed.
#
# Teardown always runs, on every trigger, whether or not earlier steps failed.

on:
  schedule:
    # 06:00 UTC daily. Scheduled runs only fire from the default branch.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      action_make_target:
        description: "AutoGlue action make_target to run after apply (the k8s setup target)"
        type: string
        required: false
        default: "setup"
      gluekube_docker_tag:
        description: "GlueKube docker tag to test (defaults to examples/test/variables.tf)"
        type: string
        required: false

permissions:
  contents: read

# Real AWS + AutoGlue infrastructure with a fixed cluster name: never let a manual
# run and the nightly run collide.
concurrency:
  group: test-apply
  cancel-in-progress: false

jobs:
  test-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/test
    env:
      # AWS provider credentials
      TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
      # network / compute
      TF_VAR_node_ami: ${{ secrets.NODE_AMI }}
      TF_VAR_bastion_ami: ${{ secrets.BASTION_AMI }}
      # AutoGlue integration
      TF_VAR_autoglue_cluster_name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
      TF_VAR_autoglue_key: ${{ secrets.AUTOGLUE_KEY }}
      TF_VAR_autoglue_org_secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}
      TF_VAR_autoglue_base_url: ${{ secrets.AUTOGLUE_BASE_URL }}
      # Route53 config
      TF_VAR_route53_aws_access_key_id: ${{ secrets.ROUTE53_AWS_ACCESS_KEY_ID }}
      TF_VAR_route53_aws_secret_access_key: ${{ secrets.ROUTE53_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
      TF_VAR_autoglue_credential_id: ${{ secrets.AUTOGLUE_CREDENTIAL_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
      

      # Needed by autoglue_nuke.py (the post-destroy cleanup step). setup-python gives a
      # pip that is not externally-managed, so `pip install requests` works cleanly.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Only override the tag when the dispatch input is non-empty, so a blank input
      # keeps the default from examples/test/variables.tf. Applies to apply + destroy.
      - name: Set GlueKube docker tag
        if: ${{ inputs.gluekube_docker_tag != '' }}
        env:
          TAG: ${{ inputs.gluekube_docker_tag }}
        run: echo "TF_VAR_gluekube_docker_tag=${TAG}" >> "$GITHUB_ENV"
      
      - name: Pre-nuke AWS
        if: always()
        uses: GlueOps/github-actions-gluekube-e2e/nuke-aws@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-west-2
      

      - name: Pre-Nuke AutoGlue org
        if: ${{ always() }}
        continue-on-error: true
        uses: GlueOps/github-actions-gluekube-e2e/nuke-autoglue@main
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          org-key: ${{ secrets.AUTOGLUE_KEY }}
          org-secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}

      - name: Tofu init
        run: tofu init

      - name: Tofu apply
        run: tofu apply -auto-approve

      - name: Invoke AutoGlue kubernetes setup
        uses: GlueOps/github-actions-gluekube-e2e/invoke-autoglue@main
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          api-key: ${{ secrets.AUTOGLUE_API_KEY }}
          org-name: ${{ secrets.AUTOGLUE_ORG_NAME }}
          cluster-name: ${{ secrets.AUTOGLUE_CLUSTER_NAME }}
          # inputs is empty on scheduled runs, so fall back to the dispatch default.
          # The action guards this again internally, since GitHub does not apply an
          # input default to a value that is present but empty.
          action-make-target: ${{ inputs.action_make_target || 'setup' }}

      - name: Check cluster health
        uses: GlueOps/github-actions-gluekube-e2e/check-cluster-health@main
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          api-key: ${{ secrets.AUTOGLUE_API_KEY }}
          org-name: ${{ secrets.AUTOGLUE_ORG_NAME }}

      - name: Tofu destroy
        if: always()
        continue-on-error: true
        run: tofu destroy -auto-approve
      
      - name: Run AWS nuke
        if: always()
        uses: GlueOps/github-actions-gluekube-e2e/nuke-aws@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-west-2

      - name: Nuke AutoGlue org
        if: ${{ always() }}
        continue-on-error: true
        uses: GlueOps/github-actions-gluekube-e2e/nuke-autoglue@main
        with:
          base-url: ${{ secrets.AUTOGLUE_BASE_URL }}
          org-key: ${{ secrets.AUTOGLUE_KEY }}
          org-secret: ${{ secrets.AUTOGLUE_ORG_SECRET }}

